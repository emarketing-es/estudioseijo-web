# Despliegue en Netlify. Las variables de entorno (Google, correo, Turnstile, GA4) se configuran en
# Netlify → Site configuration → Environment variables (ver .env.example y README), nunca aquí.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# El gestor de contenidos no se indexa
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
