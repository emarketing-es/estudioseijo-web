name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Tipos
        run: pnpm check
      - name: Tests unitarios
        run: pnpm test
      - name: Build (Netlify, como en producción)
        run: pnpm build
      - name: Build para las pruebas e2e (adaptador de Node)
        run: pnpm build:pruebas
      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests e2e
        run: pnpm test:e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
